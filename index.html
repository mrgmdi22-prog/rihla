<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>رحلة التعلّم الذاتي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=Tajawal:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<style>
/* Layout: a dawn-sky journey. One airy column, a living landscape hero (sun rises, tree blooms with progress), colour-coded task tiles, floating pill nav */
:root{
  --bg:#F5F8FD; --surface:#FFFFFF; --surface-2:#EEF3FB; --ink:#1E2A47; --muted:#5E6B86; --line:#E2E9F4;
  --sea:#2E6BE6; --sea-ink:#FFFFFF; --sea-soft:#E5EEFE;
  --coral:#F2694B; --coral-soft:#FFEAE3;
  --gold:#EFA92C; --gold-soft:#FFF3D9;
  --mint:#17A673; --mint-soft:#DCF5EB;
  --sky1:#FFE3CC; --sky2:#DDEBFF; --hill1:#C9DDF7; --hill2:#A9C9F0; --hill3:#8FB7EA;
  --leaf:#3DB27F; --leaf2:#8ED4A9; --bark:#B57C52; --cloud:#FFFFFF;
  --shadow:0 1px 2px rgba(30,42,71,.06),0 8px 24px rgba(46,107,230,.08);
  --display:"El Messiri","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --word:"Fraunces",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1628; --surface:#172139; --surface-2:#1F2B47; --ink:#E8EEFA; --muted:#A3B0CC; --line:#2A3757;
  --sea:#7FA8FF; --sea-ink:#0F1628; --sea-soft:#1E2E52; --coral:#FF9478; --coral-soft:#3B2430;
  --gold:#F6C463; --gold-soft:#3A3122; --mint:#5DD3A4; --mint-soft:#183A33;
  --sky1:#3A3460; --sky2:#1A2A50; --hill1:#24365E; --hill2:#1E3056; --hill3:#18284A;
  --leaf:#5DCB97; --leaf2:#3F9B72; --bark:#C99068; --cloud:#41507A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1628; --surface:#172139; --surface-2:#1F2B47; --ink:#E8EEFA; --muted:#A3B0CC; --line:#2A3757;
  --sea:#7FA8FF; --sea-ink:#0F1628; --sea-soft:#1E2E52; --coral:#FF9478; --coral-soft:#3B2430;
  --gold:#F6C463; --gold-soft:#3A3122; --mint:#5DD3A4; --mint-soft:#183A33;
  --sky1:#3A3460; --sky2:#1A2A50; --hill1:#24365E; --hill2:#1E3056; --hill3:#18284A;
  --leaf:#5DCB97; --leaf2:#3F9B72; --bark:#C99068; --cloud:#41507A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.75}
#app{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 130px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.4;font-weight:700}
h1{font-size:1.85rem} h2{font-size:1.3rem} h3{font-size:1.1rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.92rem}
.en{font-family:var(--word);direction:ltr;unicode-bidi:isolate}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.1rem;font-weight:700;color:var(--sea)}
.brand svg{width:30px;height:30px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);font-size:.92rem;font-weight:700;font-variant-numeric:tabular-nums}
.chip.gold{background:var(--gold-soft);box-shadow:none} .chip.mint{background:var(--mint-soft);box-shadow:none} .chip.sea{background:var(--sea-soft);box-shadow:none}
.card{background:var(--surface);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.banner{background:linear-gradient(90deg,var(--gold-soft),var(--coral-soft));border-radius:20px;padding:14px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
/* hero */
.hero{border-radius:28px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.scene svg{display:block;width:100%;height:auto}
.hero-body{padding:6px 20px 20px;display:flex;flex-direction:column;gap:12px}
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big{font-family:var(--display);font-size:3rem;line-height:1;color:var(--sea);font-variant-numeric:tabular-nums}
.bar{height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--coral))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* buttons */
.btn{font:inherit;font-weight:700;min-height:52px;padding:8px 22px;border-radius:16px;border:0;background:var(--surface-2);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--sea);color:var(--sea-ink);box-shadow:0 6px 16px rgba(46,107,230,.28)}
.btn.coral{background:var(--coral);color:#fff;box-shadow:0 6px 16px rgba(242,105,75,.28)}
.btn.gold{background:var(--gold);color:#2B2006}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.line{background:transparent;border:2px solid var(--line)}
.btn.danger{background:var(--coral-soft);color:var(--coral)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.btn.wide{width:100%}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.daychip:focus-visible,.nav button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* task tiles */
.tasks{display:flex;flex-direction:column;gap:12px}
.tile{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);position:relative}
.tile .ic{width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:30px;height:30px}
.tile.rev .ic{background:var(--sea-soft);color:var(--sea)}
.tile.new .ic{background:var(--coral-soft);color:var(--coral)}
.tile.act .ic{background:var(--gold-soft);color:var(--gold)}
.tile b{font-size:1.08rem}
.tile .meta{font-size:.9rem;color:var(--muted)}
.tile.done{background:var(--mint-soft);box-shadow:none}
.tile.done .ic{background:var(--surface);color:var(--mint)}
.tick{display:inline-flex;align-items:center;gap:6px;color:var(--mint);font-weight:800}
@media (max-width:420px){.tile{grid-template-columns:52px minmax(0,1fr)}.tile .ic{width:52px;height:52px}.tile>.btn,.tile>.tick{grid-column:1/-1}}
.harvest{background:linear-gradient(135deg,var(--gold-soft),var(--surface));}
.harvest.due{background:linear-gradient(135deg,var(--gold-soft),var(--coral-soft))}
.harvest .head{display:flex;gap:12px;align-items:center}
.harvest .head svg{width:44px;height:44px;flex:none}
/* flash */
.flash{text-align:center;align-items:center;gap:16px;padding:0 0 22px;overflow:hidden}
.flash .band{width:100%;height:10px}
.flash.learn .band{background:linear-gradient(90deg,var(--coral),var(--gold))}
.flash.review .band{background:linear-gradient(90deg,var(--sea),var(--mint))}
.flash.test .band{background:linear-gradient(90deg,var(--gold),var(--coral))}
.flash>*:not(.band){margin-inline:20px}
.word{font-family:var(--word);font-size:3.2rem;direction:ltr;line-height:1.2;overflow-wrap:anywhere;font-weight:700;margin-top:14px}
.meaning{font-size:1.7rem;font-weight:800;color:var(--sea)}
.steps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.steps span{background:var(--surface-2);padding:2px 10px;border-radius:99px}
/* forms */
label{font-weight:700;display:flex;flex-direction:column;gap:6px}
input,textarea,select{font:inherit;font-weight:500;color:var(--ink);background:var(--surface-2);border:2px solid transparent;border-radius:14px;padding:10px 14px;min-height:52px;width:100%;box-sizing:border-box}
input:focus,textarea:focus,select:focus{border-color:var(--sea);background:var(--surface)}
textarea{min-height:150px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.days{display:flex;gap:8px;flex-wrap:wrap}
.daychip{font:inherit;font-weight:700;min-height:46px;padding:4px 16px;border-radius:14px;border:0;background:var(--surface-2);color:var(--ink);cursor:pointer}
.daychip[aria-pressed="true"]{background:var(--sea);color:var(--sea-ink)}
.tpl{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.tpl button{text-align:right;flex-direction:column;align-items:flex-start;padding:16px;min-height:84px;border:2px solid transparent}
.tpl button[aria-pressed="true"]{border-color:var(--sea);background:var(--sea-soft)}
.stat{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:2px}
.stat:nth-child(4n+1){background:var(--sea-soft)} .stat:nth-child(4n+2){background:var(--mint-soft)} .stat:nth-child(4n+3){background:var(--gold-soft)} .stat:nth-child(4n+4){background:var(--coral-soft)}
.stat b{font-family:var(--display);font-size:1.8rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.9rem;color:var(--muted)}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;border-radius:20px;background:var(--surface-2);text-align:center;opacity:.6}
.badge.on{opacity:1;background:linear-gradient(160deg,var(--gold-soft),var(--mint-soft))}
.badge svg{width:56px;height:56px}
.heat{overflow-x:auto;padding-bottom:6px}
.heat table{border-collapse:separate;border-spacing:5px;margin-inline:auto}
.heat td{width:22px;height:22px;border-radius:7px;background:var(--surface-2);padding:0}
.heat td.miss{background:var(--coral-soft)}
.heat td.l1{background:var(--sea-soft)}
.heat td.l2{background:color-mix(in srgb,var(--sea) 50%,var(--sea-soft))}
.heat td.l3{background:var(--sea)}
.heat td.fut{background:transparent;border:2px dashed var(--line)}
.heat td.today{outline:3px solid var(--gold);outline-offset:1px}
.heat th{font-weight:500;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;margin-inline-end:4px}
.wlist{display:flex;flex-direction:column}
.witem{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.witem .en{font-size:1.2rem;font-weight:700}
.pill{font-size:.8rem;padding:3px 12px;border-radius:99px;font-weight:700;white-space:nowrap}
.pill.new{background:var(--surface-2);color:var(--muted)}
.pill.learning{background:var(--sea-soft);color:var(--sea)}
.pill.mastered{background:var(--mint-soft);color:var(--mint)}
.tests{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:96px minmax(0,1fr) 64px;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.note{background:var(--gold-soft);border-radius:18px;padding:14px 16px}
.alert{background:var(--coral-soft);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.confirm{background:var(--coral-soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
details{background:var(--surface-2);border-radius:14px;padding:10px 14px}
details summary{cursor:pointer;font-weight:700}
details input{background:var(--surface)}
.step-n{display:inline-flex;width:34px;height:34px;border-radius:12px;align-items:center;justify-content:center;background:var(--sea-soft);color:var(--sea);font-family:var(--display);margin-inline-end:8px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.nav div{pointer-events:auto;max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-radius:26px;box-shadow:0 10px 30px rgba(30,42,71,.16);padding:6px}
.nav button{font:inherit;font-size:.86rem;font-weight:700;background:none;border:0;color:var(--muted);padding:8px 4px;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--sea);background:var(--sea-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:16px;z-index:30;font-weight:700;max-width:calc(100% - 32px)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
@media (prefers-reduced-motion:no-preference){
 .sun{animation:glow 4s ease-in-out infinite alternate}@keyframes glow{to{opacity:.75}}
 .cloud{animation:drift 18s ease-in-out infinite alternate}@keyframes drift{to{transform:translateX(18px)}}
 .flash{animation:pop .28s ease-out}@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:.4}to{transform:none;opacity:1}}
}
</style>

<script>

document.documentElement.setAttribute('dir','rtl');document.documentElement.setAttribute('lang','ar');
const KEY='rihla-self-learning-v1';
const INTERVALS=[1,3,7,14,30];
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const RHYTHM=[
 {a:'استمع إلى مقطع قصير، واكتب 3 كلمات سمعتها',l:''},
 {a:'اقرأ نصاً قصيراً، وابحث فيه عن كلماتك',l:''},
 {a:'تدرّب والعب بكلماتك في تطبيق تحبه',l:''},
 {a:'اكتب 5 جمل بكلمات الأسبوع',l:''},
 {a:'سجّل صوتك دقيقة عن موضوع الأسبوع، ثم اختبر نفسك',l:''},
 {a:'يوم التعويض: أكمل ما فاتك هذا الأسبوع',l:''},
 {a:'راجع كلمات الأسبوع بهدوء',l:''}];
const TEMPLATES=[
 {id:'t1000',t:'ألف كلمة في 20 أسبوعاً',d:'10 كلمات يومياً، 5 أيام',goal:1000,weeks:20,minutes:30},
 {id:'school',t:'مفردات كتاب المدرسة',d:'فصل دراسي كامل',goal:300,weeks:12,minutes:20},
 {id:'exam',t:'استعداد لاختبار',d:'وتيرة أسرع في 8 أسابيع',goal:600,weeks:8,minutes:40},
 {id:'free',t:'رحلة حرّة',d:'حدّد أرقامك بنفسك',goal:200,weeks:10,minutes:15}];
const SAMPLE=[['water','ماء'],['family','عائلة'],['friend','صديق'],['morning','صباح'],['travel','يسافر'],['happy','سعيد'],['quiet','هادئ'],['answer','إجابة'],['build','يبني'],['choose','يختار'],['decide','يقرّر'],['explain','يشرح'],['follow','يتبع'],['gather','يجمع'],['hope','أمل'],['improve','يحسّن'],['journey','رحلة'],['kind','لطيف'],['listen','يستمع'],['market','سوق'],['nature','طبيعة'],['offer','يعرض'],['prepare','يحضّر'],['question','سؤال'],['remember','يتذكّر'],['simple','بسيط'],['teach','يعلّم'],['understand','يفهم'],['visit','يزور'],['wonder','يتساءل'],['borrow','يستعير'],['careful','حذر'],['daily','يومي'],['early','مبكّر'],['forget','ينسى'],['garden','حديقة'],['honest','صادق'],['invite','يدعو'],['laugh','يضحك'],['mountain','جبل'],['nearby','قريب'],['opinion','رأي'],['patient','صبور'],['rain','مطر'],['share','يشارك'],['strong','قوي'],['tomorrow','غداً'],['useful','مفيد'],['village','قرية'],['weather','طقس'],['young','صغير السن'],['believe','يصدّق'],['coast','ساحل'],['desert','صحراء'],['enough','كافٍ'],['feel','يشعر'],['guest','ضيف'],['history','تاريخ'],['island','جزيرة'],['valley','وادٍ']];

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const TODAY=()=>ymd(new Date());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(s,opt){try{return pd(s).toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',opt||{weekday:'long',day:'numeric',month:'long'})}catch(e){return s}}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function fresh(profile){return{v:1,profile,words:[],log:{},tests:[],rhythm:RHYTHM.map(x=>({...x})),nextId:1,rescue:null,demo:false}}
function mkWord(S,w,m){return{id:S.nextId++,w,m:m||'',x:'',s:'new',st:0,due:null,on:null,lp:0}}

function demo(){
  const t=TODAY(),start=add(t,-18),R=rng(11);
  const s=fresh({name:'متعلّم تجريبي',start,goal:240,weeks:12,minutes:30,days:[0,1,2,3,4],time:'16:30',anchor:'بعد صلاة العصر',witness:'والدي',mode:'extend',testDay:4});
  s.demo=true;
  SAMPLE.forEach(([w,m])=>s.words.push(mkWord(s,w,m)));
  let i=0;const skip=[add(start,8),add(start,9)];
  for(let d=start;d<t;d=add(d,1)){
    if(!s.profile.days.includes(pd(d).getDay())||skip.includes(d))continue;
    let n=0;
    while(n<4&&i<44){const w=s.words[i++];n++;const age=diff(d,t);
      w.s='learning';w.on=d;w.st=age>12?3:age>6?2:age>2?1:0;
      w.due=add(t,i%4===0?0:1+Math.floor(R()*5));
      if(w.st===3&&i%3===0){w.s='mastered';w.due=null}}
    s.log[d]={n,r:3+Math.floor(R()*7),a:R()>.2?1:0};
  }
  s.tests=[{date:add(start,4),week:1,score:18,total:20},{date:add(start,11),week:2,score:13,total:16}];
  return s;
}
function load(){try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);if(s&&s.profile&&Array.isArray(s.words))return s}}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

let S=load()||demo();
let TAB='today',Q=null,SETUP=null,CONFIRM=false,FILTER='';

function bump(k){const t=TODAY();S.log[t]=S.log[t]||{n:0,r:0,a:0};S.log[t][k]=(S.log[t][k]||0)+1}
function active(d){const l=S.log[d];return!!l&&(l.n+l.r+l.a)>0}
function isStudy(d){return S.profile.days.includes(pd(d).getDay())}

function plan(){
  const p=S.profile,t=TODAY(),end=add(p.start,p.weeks*7);
  const base=Math.max(1,Math.ceil(p.goal/(p.weeks*Math.max(1,p.days.length))));
  let passed=0,remaining=0;
  for(let d=p.start;d<t;d=add(d,1))if(isStudy(d))passed++;
  for(let d=t>p.start?t:p.start;d<end;d=add(d,1))if(isStudy(d))remaining++;
  const learned=S.words.filter(w=>w.s!=='new').length;
  const mastered=S.words.filter(w=>w.s==='mastered').length;
  const today=S.words.filter(w=>w.on===t).length;
  const before=learned-today;
  const planned=Math.min(p.goal,base*passed);
  const behind=Math.max(0,planned-before),ahead=Math.max(0,before-planned);
  const study=isStudy(t)&&t>=p.start;
  let quota=0;
  if(study)quota=p.mode==='catchup'?base+Math.ceil(behind/Math.max(1,remaining)):base;
  else if(S.rescue===t)quota=Math.min(behind,base*2);
  const newLeft=S.words.filter(w=>w.s==='new').length;
  const todo=Math.max(0,Math.min(quota-today,newLeft));
  const goalLeft=Math.max(0,p.goal-learned);
  let proj=t,cnt=0,need=Math.ceil(goalLeft/base);
  if(need>0){let d=today>=quota?add(t,1):t;for(let k=0;k<3000;k++){if(isStudy(d)){cnt++;if(cnt>=need)break}d=add(d,1)}proj=d}
  const week=Math.max(1,Math.floor(diff(p.start,t)/7)+1);
  const due=S.words.filter(w=>w.s==='learning'&&w.due&&w.due<=t);
  return{base,passed,remaining,learned,mastered,today,planned,behind,ahead,study,quota,todo,newLeft,end,proj,week,due,pct:Math.min(1,learned/Math.max(1,p.goal))};
}
function streak(){let d=TODAY(),c=0;if(!active(d))d=add(d,-1);
  for(let i=0;i<500&&d>=S.profile.start;i++){if(active(d))c++;else if(isStudy(d))break;d=add(d,-1)}return c}
function stage(p){return p>=1?'اكتملت الشجرة':p>=.75?'مرحلة الشجرة':p>=.5?'مرحلة الغصن':p>=.25?'مرحلة البرعم':'مرحلة البذرة'}
function weekRange(w){const s=add(S.profile.start,(w-1)*7);return[s,add(s,6)]}
function weekWords(w){const[a,b]=weekRange(w);return S.words.filter(x=>x.on&&x.on>=a&&x.on<=b)}

const LEAVES=(()=>{const R=rng(7),a=[];for(let i=0;i<90;i++){const ang=R()*Math.PI*2,rad=Math.sqrt(R());a.push([Math.cos(ang)*rad,Math.sin(ang)*rad*.78,R()])}return a})();
function scene(p,mini){
  const tx=262,base=178,h=12+p*70,top=base-h,cr=9+p*46,n=p>=.02?Math.round(5+p*60):0;

  let bl='';const nb=p>.35?Math.round((p-.35)*34):0;
  for(let i=0;i<nb;i++){const[x,y,k]=LEAVES[89-i];bl+=`<circle cx="${(tx+x*cr*.9).toFixed(1)}" cy="${(top+y*cr*.9).toFixed(1)}" r="${(2.6+k*1.6).toFixed(1)}" fill="${i%2?'var(--coral)':'var(--gold)'}"/>`}
  const br=p>=.2?`<path d="M${tx} ${top+h*.5} Q${tx-cr*.3} ${top+cr*.3} ${tx-cr*.6} ${top+cr*.05}" stroke="var(--bark)" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M${tx} ${top+h*.4} Q${tx+cr*.3} ${top+cr*.2} ${tx+cr*.62} ${top-cr*.05}" stroke="var(--bark)" stroke-width="4" stroke-linecap="round" fill="none"/>`:'';
  const trunk=p>=.02?`<path d="M${tx} ${base} L${tx} ${top+cr*.3}" stroke="var(--bark)" stroke-width="${5+p*7}" stroke-linecap="round"/>`:`<ellipse cx="${tx}" cy="${base-2}" rx="8" ry="5" fill="var(--bark)"/><path d="M${tx} ${base-5} q-2 -14 12 -18" stroke="var(--leaf)" stroke-width="3.5" fill="none" stroke-linecap="round"/><ellipse cx="${tx+12}" cy="${base-23}" rx="6" ry="3.5" fill="var(--leaf)" transform="rotate(-30 ${tx+12} ${base-23})"/>`;
  const sy=150-p*100;

  <g class="cloud" opacity=".9"><ellipse cx="226" cy="44" rx="30" ry="11" fill="var(--cloud)"/><ellipse cx="246" cy="36" rx="18" ry="12" fill="var(--cloud)"/><ellipse cx="150" cy="70" rx="20" ry="7" fill="var(--cloud)"/></g>
  <path d="M0 140 Q60 104 130 124 T262 112 T360 118 V210 H0Z" fill="var(--hill1)"/>
  <path d="M0 162 Q90 130 180 152 T360 140 V210 H0Z" fill="var(--hill2)"/>
  <path d="M40 210 Q100 184 160 186 T250 178" stroke="var(--cloud)" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" fill="none" opacity=".9"/>
  <path d="M0 188 Q120 164 240 180 T360 174 V210 H0Z" fill="var(--hill3)"/>
  ${trunk}${br}${leaves}${bl}</svg>`;
}

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.getElementById('fx'),x=c.getContext('2d');if(!x)return;
  const W=c.width=innerWidth,H=c.height=innerHeight,cs=getComputedStyle(document.documentElement);
  const cols=['--sea','--coral','--gold','--mint','--leaf'].map(k=>cs.getPropertyValue(k).trim()||'#2E6BE6');
  const R=rng(Date.now()%9999),ps=Array.from({length:110},()=>({x:W/2,y:H*.35,vx:(R()-.5)*14,vy:-R()*12-4,s:5+R()*6,r:R()*6,vr:(R()-.5)*.3,c:cols[Math.floor(R()*cols.length)]}));
  let f=0;(function tick(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});
    if(++f<120)requestAnimationFrame(tick);else x.clearRect(0,0,W,H)})();
}

/* ---------- render ---------- */
function render(){
  const app=document.getElementById('app');

  if(TAB==='setup')html=vSetup();

  else html={today:vToday,words:vWords,journey:vJourney,settings:vSettings}[TAB]();
  app.innerHTML=html;
  if(Q&&Q.i>=Q.ids.length&&!Q.party){Q.party=1;setTimeout(confetti,150)}
  const nav=document.getElementById('nav');
  nav.hidden=TAB==='setup'||!!Q;
  nav.innerHTML=`<div>${[['today','اليوم'],['words','كلماتي'],['journey','رحلتي'],['settings','الإعدادات']].map(([k,l])=>`<button data-act="tab" data-v="${k}" ${TAB===k?'aria-current="page"':''}>${I[k]}<span>${l}</span></button>`).join('')}</div>`;
  if(TAB==='setup')setupCalc();
  const mi=document.getElementById('m-in');if(mi&&!mi.value)mi.focus({preventScroll:true});
}
function val(id){const e=document.getElementById(id);return e?e.value:''}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,2200)}
function say(w){try{if(!('speechSynthesis' in window))throw 0;const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){toast('النطق غير متاح في هذا المتصفح')}}
function parseWords(text){const out=[],seen=new Set(S.words.map(w=>w.w.toLowerCase()));
  text.split(/\r?\n/).forEach(line=>{line=line.trim();if(!line)return;
    const m=line.match(/^(.+?)\s*(?:\t|\s[-–—]\s|[,،=|:])\s*(.*)$/);let w=(m?m[1]:line).trim(),mean=(m?m[2]:'').trim();
    w=w.replace(/^\d+[.)\-\s]+/,'').trim();if(!w||seen.has(w.toLowerCase()))return;seen.add(w.toLowerCase());out.push([w,mean])});return out}
function startQ(kind,ids,extra){if(!ids.length){toast('لا كلمات هنا الآن');return}Q={kind,ids,i:0,known:0,missed:0,reveal:false,draft:'',...extra};window.scrollTo(0,0);render()}

  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(x){fb()}}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v,t=TODAY();

  case'mode':S.profile.mode=v;save();break;
  case'rescue':S.rescue=t;save();break;
  case'review':startQ('review',plan().due.sort((x,y)=>(x.due>y.due?1:-1)).map(w=>w.id));return;
  case'learn':{const p=plan();startQ('learn',S.words.filter(w=>w.s==='new').slice(0,p.todo).map(w=>w.id));return}
  case'extra':startQ('learn',S.words.filter(w=>w.s==='new').slice(0,5).map(w=>w.id));return;
  case'test':{const wk=Math.min(plan().week,S.profile.weeks);let ws=weekWords(wk);if(!ws.length)ws=weekWords(wk-1);startQ('test',ws.map(w=>w.id),{week:wk});return}
  case'activity':{S.log[t]=S.log[t]||{n:0,r:0,a:0};S.log[t].a=S.log[t].a?0:1;save();break}
  case'say':say(v);return;
  case'reveal':if(Q){Q.draft=val('m-in');Q.reveal=true;const xi=document.getElementById('x-in');if(xi){const w=S.words.find(z=>z.id===Q.ids[Q.i]);w.x=xi.value}}break;

  case'import':{try{const n=JSON.parse(val('bk'));if(!n.profile||!Array.isArray(n.words))throw 0;S=n;save();toast('استُعيدت رحلتك');TAB='today'}catch(x){toast('النص غير صالح. الصق النسخة كاملة')}break}
  case'askreset':CONFIRM=true;break;
  case'noconfirm':CONFIRM=false;break;
  case'reset':CONFIRM=false;SETUP={name:'',tpl:'t1000',goal:1000,weeks:20,minutes:30,days:[0,1,2,3,4],time:'16:30',anchor:'بعد صلاة العصر',witness:'',words:''};TAB='setup';window.scrollTo(0,0);break;
  }
  render();
});
document.addEventListener('input',ev=>{if(ev.target.id==='f-in'){FILTER=ev.target.value;const pos=ev.target.selectionStart;render();const f=document.getElementById('f-in');f.focus();try{f.setSelectionRange(pos,pos)}catch(e){}}
  if(['u-goal','u-weeks'].includes(ev.target.id))setupCalc()});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&Q&&Q.kind==='learn'&&ev.target.id==='m-in'){ev.preventDefault();document.querySelector('[data-act="learned"]').click()}});
function grabSetup(){return{name:val('u-name'),goal:val('u-goal'),weeks:val('u-weeks'),minutes:val('u-min'),time:val('u-time'),anchor:val('u-anchor'),witness:val('u-wit'),words:val('u-words'),days:SETUP.days}}
render();
</script>
</body></html>
